[project]
name = "screen-activity-logger"
version = "0.1.0"
description = "画面録画動画をローカルでOCR+VLM解析し、日本語の作業ログを生成する"
requires-python = ">=3.12,<3.13"
dependencies = [
    "paddleocr>=3.0",
    "paddlepaddle>=3.0",
    "ollama>=0.4",
    "pillow>=10.0",
    # vllm-mlxバックエンド・発話要旨・サーバー到達性チェックが直接import
    # （ollamaの推移的依存に頼らない、4AIレビューR1）
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# ASRバックエンド（Issue #16）。遅延importのためCIでは不要。
asr-mlx = [
    "mlx-whisper>=0.4",  # Apple Silicon専用
]
asr-faster = [
    "faster-whisper>=1.1",  # Windows/Linux/Intel Mac（MacでもCPU動作可）
]
asr = [
    # 全プラットフォームのフォールバック実体（auto解決と整合、4AIレビューR1）。
    # Macの本線whisper.cppはPython依存でなく brew install whisper-cpp（README参照）。
    # mlx-whisperは長時間入力で品質崩壊のため既定導入から除外（Issue #22、.[asr-mlx]で明示オプトイン）
    "faster-whisper>=1.1",
]
search = [
    # 活用層: 意味検索（Issue #5）。Ruri v3はCPUで動く軽量埋め込み
    "sentence-transformers>=3.4",
    "transformers>=4.48",  # Ruri v3（ModernBERT）の下限
    "numpy>=1.26",
]

[project.scripts]
screen-activity-logger = "screen_activity_logger.cli:main"
sal-search = "screen_activity_logger.search_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screen_activity_logger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]  # tests/support/ の共有ヘルパー（fonts/tts）用
markers = [
    "slow: モデルダウンロード等を伴う重いテスト（-m 'not slow' で除外可）",
    "integration: 外部プロセス（ffmpeg等）を使う統合テスト",
]

[tool.coverage.run]
source = ["src/screen_activity_logger"]
omit = [
    "src/screen_activity_logger/cli.py",
    "src/screen_activity_logger/search_cli.py",
]
