[project]
name = "screen-activity-logger"
version = "0.1.0"
description = "画面録画動画をローカルでOCR+VLM解析し、日本語の作業ログを生成する"
requires-python = ">=3.12,<3.13"
dependencies = [
    "paddleocr>=3.0",
    "paddlepaddle>=3.0",
    "ollama>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pillow>=10.0",
]

[project.scripts]
screen-activity-logger = "screen_activity_logger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screen_activity_logger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: モデルダウンロード等を伴う重いテスト（-m 'not slow' で除外可）",
    "integration: 外部プロセス（ffmpeg等）を使う統合テスト",
]

[tool.coverage.run]
source = ["src/screen_activity_logger"]
omit = ["src/screen_activity_logger/cli.py"]
